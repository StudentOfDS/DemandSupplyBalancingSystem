services:
  api:
    build: .
    env_file: .env.example
    ports:
      - "8000:8000"
    volumes:
      - nexus-data:/data
    depends_on:
      - redis
  worker:
    build: .
    env_file: .env.example
    command: celery -A nexus_engine.tasks.celery_app worker --loglevel=INFO
    volumes:
      - nexus-data:/data
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  nexus-data:
